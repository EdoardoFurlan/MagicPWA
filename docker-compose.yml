services:
  backend:
    build: ./backend
    container_name: receipt-backend
    restart: always
    env_file:
      - /opt/env/.env
    volumes:
      - /opt/data/receipt-app/backend_data:/app/data
    ports:
      - 8000:8000
    networks:
      - proxy-network
  frontend:
    build: ./frontend
    container_name: receipt-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - 3001:80
    networks:
      - proxy-network
networks:
  proxy-network:
    external: true




